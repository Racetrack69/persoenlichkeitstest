<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entweder Oder">

<title>Entweder Oder: Aufdecken</title>
<style>
@font-face{font-family:Literata;font-style:normal;font-weight:400;font-display:swap;src:url("fonts/literata-latin-normal.woff2") format("woff2")}
@font-face{font-family:Literata;font-style:italic;font-weight:400;font-display:swap;src:url("fonts/literata-latin-italic.woff2") format("woff2")}
:root{
  color-scheme:dark;
  --table:#17110E; --on:#EFE4D2; --on-soft:#B3A493; --on-mute:#857767; --on-line:#3A2F27;
  --card:#F2E8D8; --card-ink:#2A1E17; --card-soft:#6B5747; --card-line:#DDCFB9;
  --sand:#E7D7BE; --deck1:#C9B99F; --deck2:#8F7F69;
  --accent:#E9B872; --accent-ink:#1E1510; --btn:#F2E8D8; --flag:#E39A82;
  --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-s:0 10px 24px rgba(0,0,0,.4);
  --serif:Literata,ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body.night{
  --table:#0E1117; --on-line:#262D39;
  --card:#232A36; --card-ink:#EDE6DA; --card-soft:#A7AFBC; --card-line:#353D4B;
  --sand:#2C3443; --deck1:#1C222D; --deck2:#151A22; --btn:#E6DED1;
  --shadow:0 18px 40px rgba(0,0,0,.6); --shadow-s:0 10px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--table);color:var(--on);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;transition:background-color .7s ease;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.progress{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) 20px 0;opacity:0;transition:opacity .3s;pointer-events:none}
.progress.on{opacity:1}
.seg{flex:1;height:2px;border-radius:2px;background:var(--on-line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

.screen{max-width:30rem;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 20px calc(env(safe-area-inset-bottom) + 14px)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 4px 10px;font-size:14px;color:var(--on-soft)}
.top b{font-weight:500;color:var(--on)}
.txt{background:none;border:0;padding:10px 4px;margin:0 -4px;font-size:15px;color:var(--on-soft);cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding-top:10px}

.deck{position:relative;margin-bottom:14px}
.deck::before,.deck::after{content:"";position:absolute;border-radius:20px}
.deck::after{left:18px;right:18px;top:20px;bottom:-14px;background:var(--deck2)}
.deck::before{left:9px;right:9px;top:10px;bottom:-7px;background:var(--deck1);z-index:1}
.qcard{position:relative;z-index:2;background:var(--card);color:var(--card-ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 24px 24px;transition:background-color .7s ease,color .7s ease}
.qhead{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-soft)}
.qhead span:last-child{letter-spacing:.04em;font-variant-numeric:tabular-nums}
.qtext{margin:14px 0 0;font-family:var(--serif);font-size:27px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.qtext.l{font-size:23px;line-height:1.25}
.qtext.s{font-size:18px;line-height:1.3}

.hand{margin:auto 0;padding:22px 8px 4px}
.step{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--on-soft);margin:0 0 12px}
.acard{display:flex;align-items:center;gap:12px;min-height:68px;border-radius:16px;background:var(--sand);color:var(--card-ink);box-shadow:var(--shadow-s);padding:14px 16px 14px 22px;font-family:var(--serif);font-size:21px;line-height:1.25;text-wrap:balance;transition:background-color .7s ease,color .7s ease,box-shadow .2s ease}
.acard.a1{transform:rotate(-1deg)}
.acard.a2{transform:rotate(1deg)}
.acard .t{flex:1;min-width:0}
.acard .toks{display:flex;gap:6px;flex:none}
.oder{text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--on-mute);padding:8px 0}
.tok{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-family:var(--serif);font-size:15px;line-height:1;flex:none}
.tok.solid{background:var(--card-ink);color:var(--sand)}
.tok.ring{border:2px solid var(--card-ink);color:var(--card-ink)}
.pop .acard .tok{animation:pop .32s cubic-bezier(.2,.8,.2,1.2) both}
.pop .acard .tok+.tok{animation-delay:.12s}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin:16px 0 0;font-size:13px;color:var(--on-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .tok{width:22px;height:22px;font-size:11px}
.legend .tok.solid{background:var(--on);color:var(--table)}
.legend .tok.ring{border:1.5px solid var(--on);color:var(--on)}
.cap{text-align:center;margin:14px 0 0;font-size:15px;color:var(--on)}
.ask{text-align:center;margin:4px 0 0;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--accent)}

.kicker{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:50px;line-height:1;letter-spacing:-.02em}
h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.12;letter-spacing:-.015em}
h3{margin:30px 0 4px;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.25}
.lead{margin:0;font-size:16px;line-height:1.55;color:var(--on-soft)}
.lead+.lead{margin-top:10px}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--btn);color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.line{background:none;border:1.5px solid var(--on-line);color:var(--on)}
.btn:disabled{opacity:.35;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px}
.link{background:none;border:0;padding:8px 0;font-size:14px;color:var(--on-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.warn{margin:12px 0 0;font-size:14px;color:var(--flag)}
.warn:empty{display:none}

.slot{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:12px 18px;margin-top:10px;border-radius:14px;border:1.5px dashed var(--on-line);color:var(--on-soft)}
.slot.ok{border-style:solid;color:var(--on)}
.slot .st{font-size:14px;white-space:nowrap}
.slot.ok .st{color:var(--accent)}
label{display:block;font-size:15px;color:var(--on-soft);margin:22px 0 8px}
textarea{display:block;width:100%;min-height:96px;padding:12px 14px;border:1.5px solid var(--on-line);border-radius:14px;background:none;color:var(--on);font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}

.tally{background:var(--card);color:var(--card-ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 24px 24px}
.tally .who{margin:20px 0 0;font-size:14px;color:var(--card-soft)}
.tally .n{margin:2px 0 0;font-family:var(--serif);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.tally .o{font-size:14px;color:var(--card-soft)}

.list{list-style:none;margin:10px 0 0;padding:0}
.list li{padding:12px 0;border-top:1px solid var(--on-line)}
.list .q{display:block;font-family:var(--serif);font-size:17px;line-height:1.3;color:var(--on)}
.list .d{display:block;margin-top:3px;font-size:14px;line-height:1.45;color:var(--on-soft)}
details{margin-top:4px}
summary{cursor:pointer;font-size:14px;color:var(--on-soft);text-decoration:underline;text-underline-offset:3px;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
.stats{display:flex;gap:18px;margin-top:10px}
.stats div{flex:1}
.big{margin:0;font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin:18px 0 6px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px 10px 0;border-top:1px solid var(--on-line);font-weight:400;vertical-align:top}
thead th{border-top:0;font-size:13px;color:var(--on-soft)}
td.n{font-family:var(--serif);font-size:19px;color:var(--accent);white-space:nowrap}
.callout{margin:26px 0 0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--accent)}

.deal .qcard,.deal .tally{animation:dealIn .38s cubic-bezier(.2,.7,.2,1) both}
.deal .deck::before,.deal .deck::after{animation:fadeIn .38s ease both}
.deal .hand{animation:rise .38s .08s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .25s ease both}
@keyframes dealIn{from{opacity:0;transform:translateX(28px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.rev .qcard{padding-bottom:18px}
.rev .hand{padding-top:14px}
.rev .acard{min-height:56px;padding:11px 14px 11px 18px;font-size:19px}
.rev .oder{padding:4px 0}
.rev .legend{margin-top:10px}
.rev .cap{margin-top:8px}
.rev .ask{font-size:17px}
.rev #go{margin-top:12px!important}
@media (max-height:720px){
  .screen{padding-top:calc(env(safe-area-inset-top) + 22px)}
  .qcard{padding:16px 20px 20px}
  .qtext{font-size:23px;margin-top:10px}.qtext.l{font-size:20px}
  .hand{padding-top:12px}
  .step{margin-bottom:8px}
  .acard{min-height:54px;padding:10px 14px 10px 18px;font-size:19px}
  .tok{width:32px;height:32px}
  .oder{padding:3px 0}
  .legend{margin-top:8px}
  .cap{margin-top:6px}
  .ask{font-size:17px}
  #go{margin-top:10px!important}
  .rev .qhead{display:none}
  .rev .qtext{margin-top:0}
  .rev .acard{min-height:50px;padding:9px 12px 9px 16px;font-size:17.5px}
  .rev .ask{font-size:16px}
  .rev .step{margin-bottom:6px}
  .foot{min-height:40px;padding-top:2px}
}
.flash{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent)}
.plab{margin:28px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
.pairbtn{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:64px;margin-top:10px;padding:14px 18px;border:0;border-radius:16px;background:var(--card);color:var(--card-ink);box-shadow:var(--shadow-s);text-align:left;cursor:pointer}
.pairbtn .pn{font-family:var(--serif);font-size:21px;line-height:1.2}
.pairbtn .ps{font-size:14px;font-weight:600;color:var(--card-soft);white-space:nowrap}
/* v1.6: Marken mit Stufe auf den Antwortkarten */
.tk{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.sw{font-family:var(--sans);font-size:11px;line-height:1;letter-spacing:.02em;color:var(--card-soft);white-space:nowrap}
.acard .toks{align-items:flex-start}
.tally .qtext{margin-bottom:2px}
.tl{margin:12px 0 0;font-size:16px;line-height:1.5;color:var(--card-soft)}
.demo{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;margin-top:16px;font-size:15px;color:var(--card-ink)}
.demo .tok.solid{background:var(--card-ink);color:var(--card)}
.demo .tok.ring{border:2px solid var(--card-ink);color:var(--card-ink)}
.rev .oder{padding:2px 0}
@media (max-height:720px){
  .rev .tok{width:30px;height:30px;font-size:13px}
  .rev .sw{font-size:10px}
}
/* Variante 1 (07.10.): Sprechblase = was jemand über sich sagt, Denkblase = was der andere gedacht hat.
   Jede Person hat ihre Farbe: erste Person Terrakotta, zweite Blau. Gedachtes steht kursiv. */
:root{--pa:#E8956A;--pb:#86A9CE}
.p0{--c:var(--pa)}.p1{--c:var(--pb)}
.cmp{display:flex;flex-direction:column;gap:16px}
/* Beim Aufdecken oben verankert: „Über Anna“ bleibt stehen, wenn „Über Ben“ dazukommt. */
.rev .hand.anchor{margin:0 0 auto;padding-top:18px}
.dir{display:flex;flex-direction:column;gap:7px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.dh .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft);white-space:nowrap}
.dh .s{font-size:13px;line-height:1.3;color:var(--on-soft);text-align:right}
.dh .s.v{color:var(--accent);font-weight:600}
.br{display:flex;align-items:center;gap:13px}
.br.th{gap:5px}
.who{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#17110E;font-family:var(--serif);font-size:15px;line-height:1}
.say{position:relative;flex:1;min-width:0;background:var(--card);color:var(--card-ink);border-radius:16px;padding:7px 16px 9px;box-shadow:var(--shadow-s)}
.say::before{content:"";position:absolute;left:-5px;top:50%;width:13px;height:13px;background:var(--card);border-radius:2px;transform:translateY(-50%) rotate(45deg)}
.say>span{position:relative}
.dots{flex:none;display:flex;align-items:center;gap:3px}
.dots i{display:block;border-radius:50%;border:1.5px solid var(--c)}
.dots i:first-child{width:5px;height:5px}.dots i:last-child{width:9px;height:9px}
.think{flex:1;min-width:0;border:1.5px dashed var(--c);border-radius:22px;padding:6px 16px 8px}
.think.off{border-color:var(--on-line);padding:10px 16px}
.bl{display:block;font-size:12.5px;line-height:1.35;color:var(--card-soft)}
.think .bl{color:var(--on-soft)}
.think.off .bl{font-size:14px}
.kf{display:block;font-family:var(--serif);font-size:19px;line-height:1.25}
.think .kf{font-style:italic;color:var(--on)}
.talk{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:0 4px}
.talk .tq{display:flex;gap:10px;align-items:center;margin:0;font-size:15px;line-height:1.4;color:var(--on)}
.talk .tq .who{width:26px;height:26px;font-size:12px}
.talk .g{margin:0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3;color:var(--accent)}
.intro-demo{margin:22px 4px 0}
.intro-demo .kf{font-size:17px}
.tok.pc,.legend .tok.pc{background:var(--c);color:#17110E;border:0}
.pop .dir.new{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
.pop .dir.new .th{animation:rise .38s .2s cubic-bezier(.2,.7,.2,1) both}
.pop .talk{animation:fadeIn .3s .35s ease both}
@media (max-height:720px){
  .cmp{gap:10px}
  .dir{gap:5px}
  .who{width:30px;height:30px;font-size:14px}
  .br{gap:11px}
  .say{padding:5px 14px 7px}
  .think{padding:4px 14px 6px}
  .bl{font-size:12px}
  .kf{font-size:17px}
  .talk{margin-top:10px;gap:6px}
  .talk .tq{font-size:14px}
  .talk .g{font-size:16px}
  .rev .hand.anchor{padding-top:10px}
  .rev .qtext.s{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 {"t": "Erinnern", "qs": "Du denkst an eine schöne Zeit, die vorbei ist.", "qo": "{n} denkt an eine schöne Zeit, die vorbei ist.", "a": "Das macht mich einfach froh.", "z": "Das macht mich auch ein bisschen wehmütig.", "ka": "Einfach froh", "kz": "Etwas wehmütig", "ao": "Das macht {ihn} einfach froh.", "zo": "Das macht {ihn} auch ein bisschen wehmütig.", "g": "Welche Zeit vermisst du manchmal?"},
 {"t": "Vertrauen", "qs": "Du lernst einen neuen Menschen kennen, der dir sympathisch ist.", "qo": "{n} lernt einen neuen Menschen kennen, der {ihm} sympathisch ist.", "a": "Ich vertraue erst mal und schaue, wie es weitergeht.", "z": "Vertrauen wächst bei mir Schritt für Schritt.", "ka": "Erst mal vertrauen", "kz": "Schritt für Schritt", "ao": "{Er} vertraut erst mal und schaut, wie es weitergeht.", "zo": "Vertrauen wächst bei {ihm} Schritt für Schritt.", "g": "Wann hast du gemerkt, dass du mir vertrauen kannst?"},

function paare(list,ich){

  kuerzel:kuerzel,text:text,stufenwort:stufenwort,antwort:antwort,kurz:kurz,kurzantwort:kurzantwort,personen:personen,paare:paare,konflikte:konflikte,feedback:feedback};
})(typeof window!=="undefined"?window:this);
</script>

<script>
/* ===== Oberfläche: Sammlung, gemeinsam aufdecken, Feedback ===== */
"use strict";
(function(){
var A=window.AUSW, D=window.PT16, N=A.N, NG=A.NG, STORE="pt16-auswertung", APP_STORE="pt-v16";
var RM=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var P=load(), M=null, lastKey=null, meldung="", erfolg="";

/* Sammlung: alle eingefügten Codes, gewähltes Paar, Spielstand pro Paar. */
function load(){
  try{var o=JSON.parse(localStorage.getItem(STORE)||"null");
    if(o&&Array.isArray(o.codes))return {codes:o.codes,sel:o.sel||null,view:o.view||"start",games:o.games||{}};
  }catch(e){}
  return {codes:[],sel:null,view:"start",games:{}};
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(P));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function app(){return document.getElementById("app");}
function $(id){return document.getElementById(id);}
function game(){if(!P.sel)return {pos:0,rev:{}};return P.games[P.sel]||(P.games[P.sel]={pos:1,rev:{}});}

/* Eigene Codes liegen im Speicher der Test-App, wenn auf diesem Handy gespielt wurde. Nur lesen. */
function eigene(){
  try{var o=JSON.parse(localStorage.getItem(APP_STORE)||"null");
    if(o){
      var codes=[];
      if(Array.isArray(o.people))o.people.forEach(function(p){if(p.code)codes.push(p.code);});
      return {name:o.me||"",codes:codes,started:!!o.me,open:Array.isArray(o.people)?o.people.filter(function(p){return !p.code;}).length:0};
    }
  }catch(e){}
  return {name:"",codes:[],started:false,open:0};
}
/* Ablauf für ein Paar: Einstieg, die drei größten Unterschiede, die übrigen Karten, Überblick, Gedankenexperimente, Abschluss. */
function build(){
  var own=eigene(), seen={}, alle=[], decoded=[], fehler=[];
  own.codes.concat(P.codes).forEach(function(c){if(!seen[c]){seen[c]=1;alle.push(c);}});
  alle.forEach(function(c){try{var d=D.decode(c);d._code=c;decoded.push(d);}catch(e){fehler.push(e.message);}});
  var list=A.sammle(decoded), pairs=A.paare(list,own.name);
  var m={own:own,fehler:fehler,list:list,pairs:pairs,konflikte:A.konflikte(list),personen:A.personen(list),screens:["start"],paar:null,group:[0],nr:{}};
  var sel=null;pairs.forEach(function(x){if(x.ready&&x.key===P.sel)sel=x;});
  if(sel){
    m.paar={a:sel.a,b:sel.b};
    m.vA=A.vergleiche(sel.a,sel.b);m.vB=A.vergleiche(sel.b,sel.a);
    m.k=A.kuerzel(sel.a.name,sel.b.name);
    m.top=A.groessteUnterschiede(m.vA,m.vB,3);
    var isTop={};m.top.forEach(function(i){isTop[i]=1;});
    m.isTop=isTop;
    m.rest=[];for(var i=0;i<N;i++)if(!isTop[i])m.rest.push(i);
    var n=0;
    function add(s,g){m.screens.push(s);m.group.push(g);}
    add("intro",0);
    m.top.forEach(function(i){m.nr[i]=++n;add("i"+i,0);});
    if(m.top.length&&m.rest.length)add("t",1);
    m.rest.forEach(function(i){m.nr[i]=++n;add("i"+i,1);});
    add("hl",2);
    for(var j=0;j<NG;j++)add("g"+j,2);
    add("ende",2);
  }else if(P.view==="play")P.view="start";
  return m;
}
function pos(){return P.view==="play"&&M.paar?Math.max(1,Math.min(M.screens.length-1,game().pos)):0;}
function frame(night,dealt){
  var k=(P.view==="fb"?"fb":P.sel+"|"+M.screens[pos()]), a=app();
  if(k!==lastKey){lastKey=k;window.scrollTo(0,0);a.classList.remove("deal","fade","pop");void a.offsetWidth;if(!RM)a.classList.add(dealt?"deal":"fade");}
  document.body.classList.toggle("night",!!night);
  var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=night?"#0E1117":"#17110E";
  var p=$("bar"), at=pos();
  if(!at){p.innerHTML="";p.classList.remove("on");}
  else{
    var groups=[[],[],[]];
    M.screens.forEach(function(s,idx){if(idx>0)groups[M.group[idx]].push(idx);});
    p.innerHTML=groups.filter(function(g){return g.length;}).map(function(g){var f=g.filter(function(x){return x<=at;}).length/g.length;return '<span class="seg"><i style="width:'+Math.round(f*100)+'%"></i></span>';}).join("");
    p.classList.add("on");
  }
}
function nav(d){var G=game();G.pos=Math.max(1,Math.min(M.screens.length-1,pos()+d));save();render();}
function home(){P.view="start";save();render();}
function render(){
  if(!D||!A){app().innerHTML='<div class="screen"><h2>decoder.js fehlt</h2><p class="lead" style="margin-top:12px">Die Auswertung braucht die Datei decoder.js im selben Ordner.</p></div>';return;}
  M=build();
  if(P.view==="fb")return feedback();
  var s=M.screens[pos()];
  if(s==="start")return start();
  if(s==="intro")return intro();
  if(s==="t")return trenner();
  if(s==="hl")return hl();
  if(s==="ende")return ende();
  if(s.charAt(0)==="i")return item(+s.slice(1));
  if(s.charAt(0)==="g")return ged(+s.slice(1));
}

/* ---------- Start: die Sammlung ---------- */
function start(){
  frame(false,false);
  var own=M.own, ready=M.pairs.filter(function(x){return x.ready;}), half=M.pairs.filter(function(x){return !x.ready;});
  var warn=[];if(meldung)warn.push(esc(meldung));
  M.fehler.forEach(function(f){warn.push("Ein Code ist nicht lesbar ("+esc(f)+"). Vermutlich wurde er nicht vollständig kopiert.");});
  M.konflikte.forEach(function(n){warn.push("Unter „"+esc(n)+"“ gibt es Codes mit unterschiedlichen Antworten über sich. Entweder sind es zwei Personen mit gleichem Namen, oder Teil 1 wurde neu gemacht. Es zählt der zuletzt eingefügte Code.");});
  var notes=[];
  if(own.started&&!own.codes.length)notes.push('Deine eigenen Codes erscheinen hier automatisch, sobald ein Teil 2 fertig ist. <a href="index.html" style="color:var(--on)">Zum Spiel</a>');
  else if(own.open)notes.push(own.open===1?'Ein Teil 2 ist in deiner App noch offen.':own.open+' Teile 2 sind in deiner App noch offen.');
  var readyHtml=ready.map(function(x){
    var G=P.games[x.key], at=G&&G.pos>1?" · angefangen":"";
    return '<button class="pairbtn" data-k="'+esc(x.key)+'"><span class="pn">'+esc(x.nameA)+' und '+esc(x.nameB)+'</span><span class="ps">Aufdecken'+esc(at)+'</span></button>';
  }).join("");
  var halfHtml=half.map(function(x){
    var fehlt=x.a?x.nameB+" über "+x.nameA:x.nameA+" über "+x.nameB;
    return '<li><span class="q">'+esc(x.nameA)+' und '+esc(x.nameB)+'</span><span class="d">Es fehlt der Code von '+esc(fehlt)+'.</span></li>';
  }).join("");
  app().innerHTML='<div class="screen">'+
    '<p class="kicker" style="margin-top:34px">Entweder oder</p><h1>Aufdecken</h1>'+
    '<p class="lead" style="margin-top:14px">Setzt euch nebeneinander, ein Handy reicht. Bei jeder Karte: erst raten und kurz reden, dann aufdecken.</p>'+
    (erfolg?'<p class="flash" role="status">'+esc(erfolg)+'</p>':'')+
    (ready.length?'<p class="plab">Bereit zum Aufdecken</p>'+readyHtml:'<p class="plab">Noch kein Paar komplett</p><p class="lead" style="font-size:15px">Ein Paar ist komplett, wenn beide Codes da sind: der von Anna über Ben und der von Ben über Anna.</p>')+
    (half.length?'<p class="plab">Es fehlt noch ein Code</p><ul class="list">'+halfHtml+'</ul>':'')+
    (notes.length?'<p class="lead" style="margin-top:12px;font-size:14px">'+notes.join(" ")+'</p>':'')+
    '<label for="paste">Codes einfügen</label><textarea id="paste" placeholder="PT16.…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>'+
    '<p class="lead" style="margin-top:8px;font-size:14px">Ganze WhatsApp-Nachrichten gehen, auch mehrere auf einmal. Alles außer den Codes wird ignoriert. Nichts davon verlässt dieses Handy.</p>'+
    '<button class="btn line" id="add" style="margin-top:12px">Einfügen</button>'+
    '<p class="warn" role="alert">'+warn.join("<br>")+'</p>'+
    '<p class="lead" style="margin-top:22px;font-size:14px">In der Sammlung: '+M.list.length+(M.list.length===1?" Code":" Codes")+' von '+M.personen+(M.personen===1?" Person":" Personen")+'.</p>'+
    '<div class="links" style="margin-top:auto;padding-top:18px">'+
      (M.list.length?'<button class="link" id="fb">Feedback zu den Karten</button><button class="link" id="copyall">Alle Codes kopieren</button>':'')+
      '<a class="link" href="index.html">Zum Spiel</a>'+
      (P.codes.length?'<button class="link" id="clear">Sammlung löschen</button>':'')+
    '</div></div>';
  meldung="";erfolg="";
  Array.prototype.forEach.call(app().querySelectorAll(".pairbtn"),function(b){
    b.onclick=function(){P.sel=b.dataset.k;P.view="play";game();save();render();};
  });
  $("add").onclick=function(){
    var raw=$("paste").value, found=D.findCodes(raw), old=D.findOldCodes(raw).length;
    var alt=old===1?"Ein Code stammt aus einer älteren Version mit anderen Karten und wurde übersprungen.":old>1?old+" Codes stammen aus einer älteren Version mit anderen Karten und wurden übersprungen.":"";
    if(!found.length){meldung=old?"Das ist ein Code aus einer älteren Version mit anderen Karten. Bitte spielt beide die aktuelle Version, dann passt es.":"Im eingefügten Text steckt kein Code. Ein Code beginnt mit PT16.";render();return;}
    var added=0,known=0;
    found.forEach(function(c){if(P.codes.indexOf(c)>=0||own.codes.indexOf(c)>=0)known++;else{P.codes.push(c);added++;}});
    save();
    erfolg=added?(added===1?"Ein Code hinzugefügt.":added+" Codes hinzugefügt."):"";
    if(!added)meldung=known===1?"Dieser Code ist schon in der Sammlung.":"Diese Codes sind schon in der Sammlung.";
    if(alt)meldung=(meldung?meldung+" ":"")+alt;
    render();
  };
  if($("fb"))$("fb").onclick=function(){P.view="fb";save();render();};
  if($("copyall"))$("copyall").onclick=function(){
    var txt=M.list.map(function(d){return d._code;}).join("\n"), b=$("copyall");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){b.textContent="Kopiert";},function(){b.textContent="Kopieren nicht möglich";});
    else b.textContent="Kopieren nicht möglich";
    setTimeout(function(){b.textContent="Alle Codes kopieren";},2500);
  };
  if($("clear"))$("clear").onclick=function(){
    if(confirm("Alle eingefügten Codes und Spielstände löschen? Deine eigenen Codes im Spiel bleiben.")){P={codes:[],sel:null,view:"start",games:{}};save();render();}
  };
}

/* ---------- Einstieg und Trenner ---------- */
function intro(){
  frame(false,true);
  var p=M.paar, t=M.top.length;
  var plan=t?(t===1?"Zuerst kommt die Karte, bei der ihr euch am verschiedensten seht. Danach die übrigen.":"Zuerst kommen die "+(t===2?"zwei":"drei")+" Karten, bei denen ihr euch am verschiedensten seht. Danach die übrigen."):
    "Ihr seht euch bei allen Karten auf derselben Seite. Ihr geht sie einfach der Reihe nach durch.";
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>'+esc(p.a.name)+' und '+esc(p.b.name)+'</b><button class="txt" id="home">Sammlung</button></div>'+
    '<div class="tally"><div class="qhead"><span>So geht es</span></div><p class="qtext">Wie seht ihr euch?</p>'+
      '<p class="tl">Bei jeder Karte seht ihr, wie sich jeder selbst sieht und was der andere gedacht hat. Das ist keine Bewertung. Wo ihr verschieden seht, lohnt sich das Gespräch.</p>'+
    '</div>'+
    '<div class="cmp intro-demo" aria-label="Beispiel">'+
      '<div class="br">'+who(0,M.k[0])+'<div class="say"><span class="bl">'+esc(p.a.name)+' sagt, ganz klar:</span><span class="kf">Was '+esc(p.a.name)+' über sich sagt</span></div></div>'+
      '<div class="br th">'+who(1,M.k[1])+'<span class="dots p1" aria-hidden="true"><i></i><i></i></span><div class="think p1"><span class="bl">'+esc(p.b.name)+' dachte, eher:</span><span class="kf">Was '+esc(p.b.name)+' gedacht hat</span></div></div>'+
    '</div>'+
    '<p class="lead" style="margin-top:20px;padding:0 4px">Sprechblase: gesagt. Denkblase: gedacht. Dazu steht, wie deutlich, ganz klar oder eher. '+plan+'</p>'+
    '<button class="btn" id="go" style="margin-top:auto">Erste Karte</button>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button></div></div>';
  $("go").onclick=function(){nav(1);};
  $("back").onclick=home;
  $("home").onclick=home;
}
function trenner(){
  frame(false,true);
  var r=M.rest.length;
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>Weiter geht es</b><button class="txt" id="home">Sammlung</button></div>'+
    '<div class="tally"><div class="qhead"><span>Geschafft</span></div><p class="qtext">Das waren eure größten Unterschiede.</p>'+
      '<p class="tl">Jetzt kommen die übrigen '+r+' Karten, der Reihe nach. Nehmt euch Zeit, wo es spannend wird.</p></div>'+
    '<button class="btn" id="go" style="margin-top:auto">Weiter</button>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button></div></div>';
  $("go").onclick=function(){nav(1);};
  $("back").onclick=function(){nav(-1);};
  $("home").onclick=home;
}

/* ---------- Eine Karte: erst raten, dann zweimal aufdecken ---------- */
function deckHTML(head,num,q,small){
  return '<div class="deck"><div class="qcard"><div class="qhead"><span>'+esc(head)+'</span><span>'+num+'</span></div>'+
    '<p class="qtext'+(small?" s":q.length>90?" l":"")+'">'+esc(q)+'</p></div></div>';
}
function answerCards(item,tokA,tokZ){
  function card(t,toks,cls){return '<div class="acard '+cls+'"><span class="t">'+esc(t)+'</span>'+(toks?'<span class="toks">'+toks+'</span>':'')+'</div>';}
  return card(item.a,tokA,"a1")+'<div class="oder" aria-hidden="true">oder</div>'+card(item.z,tokZ,"a2");
}
function tok(kind,letter,label){return '<span class="tok '+kind+'"'+(label?' role="img" aria-label="'+esc(label)+'"':' aria-hidden="true"')+'>'+esc(letter)+'</span>';}
/* Eine Richtung als Paar aus Sprechblase (was die Person über sich sagt) und Denkblase (was der andere gedacht hat).
   d = 0: über die erste Person, d = 1: über die zweite. Keine Pronomen, weil er/sie nicht im Code steht. */
function who(d,letter){return '<span class="who p'+d+'" aria-hidden="true">'+esc(letter)+'</span>';}
function dirHTML(it,i,d,neu){
  var p=M.paar, r=(d===0?M.vA:M.vB).items[i], ueber=d===0?p.a.name:p.b.name, tipper=d===0?p.b.name:p.a.name, t=1-d;
  var st="",cls="";
  if(!r.offen){
    if(r.gleich===false){st="Seht ihr verschieden";cls=" v";}
    else st=r.abstand===0?"Seht ihr gleich":"Gleich, verschieden deutlich";
  }
  var say='<div class="br">'+who(d,M.k[d])+'<div class="say"><span class="bl">'+esc(ueber)+' sagt, '+A.stufenwort(r.selbst)+':</span>'+
    '<span class="kf">'+esc(A.kurz(it,r.selbst))+'</span></div></div>';
  var think='<div class="br th">'+who(t,M.k[t])+'<span class="dots p'+t+'" aria-hidden="true"><i></i><i></i></span>'+
    (r.offen?'<div class="think off p'+t+'"><span class="bl">'+esc(tipper)+' hat hier offen gelassen.</span></div>':
      '<div class="think p'+t+'"><span class="bl">'+esc(tipper)+' dachte, '+A.stufenwort(r.tipp)+':</span><span class="kf">'+esc(A.kurz(it,r.tipp))+'</span></div>')+'</div>';
  return '<section class="dir'+(neu?' new':'')+'" aria-label="Über '+esc(ueber)+'"><div class="dh"><span class="k">Über '+esc(ueber)+'</span>'+
    (st?'<span class="s'+cls+'">'+st+'</span>':'')+'</div>'+say+think+'</section>';
}
function item(i){
  var G=game(), it=A.ITEMS[i], st=G.rev["i"+i]||0, p=M.paar, names=[p.a.name,p.b.name];
  frame(false,true);
  var inner;
  if(st===0){
    inner='<p class="step">Erst raten, dann aufdecken.</p>'+answerCards(it,"","");
  }else{
    /* Schritt 1: über die erste Person. Schritt 2: dazu über die zweite, die ganze Karte bleibt stehen. */
    var talk=[], r0=M.vA.items[i], r1=M.vB.items[i];
    var secs=dirHTML(it,i,0,st===1)+(st===2?dirHTML(it,i,1,true):"");
    if(st===1&&r0.gleich===false)talk.push('<p class="tq">'+who(1,M.k[1])+'<span>Wie kommst du darauf, '+esc(names[1])+'?</span></p>');
    if(st===2){
      if(r1.gleich===false)talk.push('<p class="tq">'+who(0,M.k[0])+'<span>Wie kommst du darauf, '+esc(names[0])+'?</span></p>');
      talk.push('<p class="g">'+esc(it.g)+'</p>');
    }
    inner='<div class="cmp">'+secs+'</div>'+(talk.length?'<div class="talk" role="status">'+talk.join("")+'</div>':'');
  }
  var btn=st===0?"Aufdecken: über "+esc(names[0]):st===1?"Aufdecken: über "+esc(names[1]):"Nächste Karte";
  var topLabel=M.isTop[i]?"Großer Unterschied":esc(it.t);
  app().innerHTML='<div class="screen'+(st>0?' rev':'')+'">'+
    '<div class="top"><b>'+topLabel+'</b><button class="txt" id="home">Sammlung</button></div>'+
    deckHTML(it.t,M.nr[i]+" / "+N,it.qs,st>0)+
    '<div class="hand'+(st>0?' anchor':'')+'">'+inner+'</div>'+
    '<button class="btn" id="go" style="margin-top:18px">'+btn+'</button>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button></div></div>';
  if(st>0&&!RM){var a=app();a.classList.remove("deal","fade");void a.offsetWidth;a.classList.add("pop");}
  $("go").onclick=function(){if(st<2){G.rev["i"+i]=st+1;save();render();}else nav(1);};
  $("back").onclick=function(){if(st>0){G.rev["i"+i]=st-1;save();render();}else nav(-1);};
  $("home").onclick=home;
}

/* ---------- Überblick: worüber es sich zu reden lohnt ---------- */
function li(i,d){return '<li><span class="q">'+esc(A.ITEMS[i].t)+'</span><span class="d">'+d+'</span></li>';}
/* Lange Listen: die ersten vier zeigen, den Rest zum Aufklappen. */
function ul(items){if(!items.length)return '';var h='<ul class="list">'+items.slice(0,4).join('')+'</ul>';if(items.length>4)h+='<details><summary>Noch '+(items.length-4)+' weitere</summary><ul class="list">'+items.slice(4).join('')+'</ul></details>';return h;}
function hl(){
  frame(false,false);
  var p=M.paar, dirs=[{v:M.vA,ueber:p.a.name,tipper:p.b.name},{v:M.vB,ueber:p.b.name,tipper:p.a.name}], h="", L;
  h+='<h3>Hier seht ihr verschieden</h3><p class="lead">Was jemand über sich gesagt hat und was der andere gedacht hat, liegt auf verschiedenen Seiten.</p>';
  L=[];dirs.forEach(function(x){x.v.items.forEach(function(r){if(r.gleich!==false)return;var it=A.ITEMS[r.index];
    L.push(li(r.index,esc(x.ueber)+" sagt "+esc(A.kurzantwort(it,r.selbst))+". "+esc(x.tipper)+" dachte "+esc(A.kurzantwort(it,r.tipp))+"."));});});
  h+=L.length?ul(L):'<p class="lead" style="margin-top:8px">Keine Karte. Ihr seht euch überall auf derselben Seite.</p>';
  var bd=A.beideVerschieden(M.vA,M.vB);
  h+='<h3>Hier seht ihr euch beide anders</h3>';
  h+=bd.length?ul(bd.map(function(i){return li(i,esc(A.ITEMS[i].qs));})):'<p class="lead" style="margin-top:8px">Keine Karte, bei der es euch beiden so geht.</p>';
  var g=A.gleichheit(p.a,p.b);
  h+='<h3>Wo tickt ihr gleich?</h3><p class="lead">Verglichen wird, was jeder über sich selbst gesagt hat. Bei '+g.gleich+' von '+g.gesamt+' Karten wählt ihr dieselbe Seite.</p>'+
    (g.verschieden.length?'<details><summary>Hier wählt ihr verschieden</summary><ul class="list">'+g.verschieden.map(function(i){var it=A.ITEMS[i];
      return li(i,esc(p.a.name)+" sagt "+esc(A.kurzantwort(it,p.a.self.items[i].level))+". "+esc(p.b.name)+" sagt "+esc(A.kurzantwort(it,p.b.self.items[i].level))+".");}).join("")+'</ul></details>':'');
  var pa=A.projektion(p.a), pb=A.projektion(p.b);
  if(pa||pb){
    h+='<h3>Wie viel von dir steckt in deinem Tipp?</h3><div class="stats">'+[[p.a,pa],[p.b,pb]].map(function(x){return x[1]?'<div><p class="big">'+x[1].prozent+'%</p><p class="lead" style="font-size:14px;margin-top:4px">'+esc(x[0].name)+' hat bei '+x[1].gleich+' von '+x[1].gesamt+' Karten dieselbe Seite getippt wie bei sich selbst.</p></div>':'';}).join("")+'</div>'+
      '<p class="lead" style="margin-top:12px">Reiner Zufall läge bei 50 Prozent. Wer deutlich darüber liegt, beschreibt beim Einschätzen ein Stück weit sich selbst. Wer sich ähnlich ist, liegt damit oft sogar richtig.</p>';
  }
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>Worüber es sich zu reden lohnt</b><button class="txt" id="home">Sammlung</button></div>'+
    '<h2 style="margin-top:6px">Euer Überblick</h2>'+h+
    '<button class="btn" id="go" style="margin-top:30px">Zu den Gedankenexperimenten</button>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button></div></div>';
  $("go").onclick=function(){nav(1);};
  $("back").onclick=function(){nav(-1);};
  $("home").onclick=home;
}

/* ---------- Gedankenexperimente: ohne Tipp, ohne Zählung ---------- */
function ged(j){
  var G=game(), g=A.GEDANKEN[j], st=G.rev["g"+j]||0, p=M.paar;
  frame(true,true);
  var tA="",tZ="",cap="";
  if(st>0){
    var va=p.a.self.gedanken[j].value, vb=p.b.self.gedanken[j].value;
    var ta=tok("solid pc p0",M.k[0],p.a.name), tb=tok("solid pc p1",M.k[1],p.b.name);
    if(va===0)tA+=ta;else tZ+=ta;
    if(vb===0)tA+=tb;else tZ+=tb;
    cap=va===vb?"Gleich gewählt.":"Verschieden gewählt.";
  }
  app().innerHTML='<div class="screen'+(st>0?' rev':'')+'">'+
    '<div class="top"><b>Ohne Tipp, ohne Zählung</b><button class="txt" id="home">Sammlung</button></div>'+
    deckHTML("Gedankenexperiment",(j+1)+" / "+NG,g.q,st>0)+
    '<div class="hand">'+(st===0?'<p class="step">Was hat der andere wohl gewählt?</p>':'')+answerCards(g,tA,tZ)+
      (st>0?'<p class="legend"><span>'+tok("solid pc p0",M.k[0],"")+esc(p.a.name)+'</span><span>'+tok("solid pc p1",M.k[1],"")+esc(p.b.name)+'</span></p><p class="cap" role="status">'+cap+'</p><p class="ask">'+esc(g.g)+'</p>':'')+'</div>'+
    '<button class="btn" id="go" style="margin-top:18px">'+(st===0?"Aufdecken":j<NG-1?"Nächste Karte":"Zum Abschluss")+'</button>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button></div></div>';
  if(st>0&&!RM){var a=app();a.classList.remove("deal","fade");void a.offsetWidth;a.classList.add("pop");}
  $("go").onclick=function(){if(st===0){G.rev["g"+j]=1;save();render();}else nav(1);};
  $("back").onclick=function(){if(st>0){G.rev["g"+j]=0;save();render();}else nav(-1);};
  $("home").onclick=home;
}

/* ---------- Abschluss ---------- */
function ende(){
  frame(false,false);
  var p=M.paar;
  function row(v,ueber,tipper){return '<tr><td>'+esc(tipper)+' über '+esc(ueber)+'</td><td class="n">'+v.gleich+' von '+v.gezaehlt+'</td><td>'+(v.offen?v.offen+' offen':'')+'</td></tr>';}
  app().innerHTML='<div class="screen">'+
    '<p class="kicker" style="margin-top:34px">Fertig</p><h2>Das war’s</h2>'+
    '<table><thead><tr><th></th><th>Gleich gesehen</th><th></th></tr></thead><tbody>'+
      row(M.vA,p.a.name,p.b.name)+row(M.vB,p.b.name,p.a.name)+
    '</tbody></table>'+
    '<p class="lead">Verschieden gesehen ist kein Fehler, sondern Gesprächsstoff.</p>'+
    '<p class="callout">Welche Antwort hat euch am meisten überrascht?</p>'+
    '<div style="margin-top:auto;padding-top:28px"><button class="btn line" id="again">Noch einmal durchgehen</button>'+
    '<div class="links" style="justify-content:center"><button class="link" id="back">Zurück</button><button class="link" id="home">Zur Sammlung</button></div></div></div>';
  $("again").onclick=function(){var G=game();G.rev={};G.pos=1;save();render();};
  $("back").onclick=function(){nav(-1);};
  $("home").onclick=home;
}

/* ---------- Feedback zu den Karten, über alle Codes der Sammlung ---------- */
function feedback(){
  frame(false,false);
  var F=A.feedback(M.list);
  function frac(a,b){return a+" von "+b;}
  function reasons(x){
    var r=[];
    if(x.einseitig)r.push(x.mehr+" von "+x.selbst+" wählen über sich dieselbe Seite");
    if(x.eher)r.push(frac(x.eher,x.antworten)+" Antworten nur „eher“");
    if(x.offen)r.push(frac(x.offen,x.fremd)+" Mal nicht beurteilt");
    if(x.lang)r.push(frac(x.lang,x.karten)+" Mal über 15 Sekunden");
    return r;
  }
  var top=F.items.filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,5);
  var h='<p class="lead" style="margin-top:10px">Grundlage: '+F.codes+(F.codes===1?" Code":" Codes")+' von '+F.personen+(F.personen===1?" Person":" Personen")+'. Bei wenigen Codes sind das Hinweise, keine Belege.</p>';
  h+='<h3>Am auffälligsten</h3>';
  h+=top.length?'<ul class="list">'+top.map(function(x){return '<li><span class="q">'+(x.i+1)+' · '+esc(A.ITEMS[x.i].t)+'</span><span class="d">'+esc(reasons(x).join(". "))+'.</span></li>';}).join("")+'</ul>':'<p class="lead" style="margin-top:8px">Bisher fällt keine Karte auf.</p>';
  h+='<details><summary>Alle '+N+' Karten</summary><ul class="list">'+F.items.map(function(x){
    return '<li><span class="q">'+(x.i+1)+' · '+esc(A.ITEMS[x.i].t)+'</span><span class="d">Über sich: A '+x.a+', B '+x.b+', davon „eher“ '+x.eherSelbst+
      '. Getippt: '+x.getippt+', davon „eher“ '+x.eherTipp+'. Nicht beurteilt: '+x.offen+'. Über 15 Sekunden: '+frac(x.lang,x.karten)+'.</span></li>';
  }).join("")+'</ul></details>';
  h+='<h3>Gedankenexperimente</h3><ul class="list">'+F.gedanken.map(function(x){
    return '<li><span class="q">G'+(x.i+1)+' · '+esc(A.GEDANKEN[x.i].t)+'</span><span class="d">'+esc(A.GEDANKEN[x.i].a)+': '+x.a+'. '+esc(A.GEDANKEN[x.i].z)+': '+x.b+'. Über 15 Sekunden: '+frac(x.lang,x.a+x.b)+'.</span></li>';
  }).join("")+'</ul>';
  h+='<p class="lead" style="margin-top:22px;font-size:14px">So wird gezählt: Viele „eher“-Antworten können heißen, dass eine Karte zu „mal so, mal so“ führt. „Nicht beurteilt“ stammt aus Teil 2. „Über 15 Sekunden“ zählt Karten aus Teil 1 und Teil 2. Wählen fast alle über sich dieselbe Seite, trennt die Karte kaum. Jede Person zählt über sich nur einmal.</p>';
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>Feedback</b><button class="txt" id="home">Sammlung</button></div>'+
    '<h2 style="margin-top:6px">Wie die Karten ankommen</h2>'+h+
    '<div class="foot" style="margin-top:20px"><button class="txt" id="back">Zurück zur Sammlung</button></div></div>';
  $("home").onclick=home;$("back").onclick=home;
}

document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="BUTTON"||tg==="A"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(P.view!=="play")return;
  if(e.key==="Enter"||e.key==="ArrowRight"){var g=$("go");if(g&&!g.disabled){e.preventDefault();g.click();}}
  else if(e.key==="ArrowLeft"){var b=$("back");if(b){e.preventDefault();b.click();}}
});

render();
})();
</script>
</body>
</html>
