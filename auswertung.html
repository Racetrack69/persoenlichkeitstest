<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Entweder Oder: Aufdecken</title>
<style>
@font-face{font-family:Literata;font-style:normal;font-weight:400;font-display:swap;src:url("fonts/literata-latin-normal.woff2") format("woff2")}
@font-face{font-family:Literata;font-style:italic;font-weight:400;font-display:swap;src:url("fonts/literata-latin-italic.woff2") format("woff2")}
:root{
  color-scheme:dark;
  --table:#17110E; --on:#EFE4D2; --on-soft:#B3A493; --on-mute:#857767; --on-line:#3A2F27;
  --card:#F2E8D8; --card-ink:#2A1E17; --card-soft:#6B5747; --card-line:#DDCFB9;
  --sand:#E7D7BE; --deck1:#C9B99F; --deck2:#8F7F69;
  --accent:#E9B872; --accent-ink:#1E1510; --btn:#F2E8D8; --flag:#E39A82;
  --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-s:0 10px 24px rgba(0,0,0,.4);
  --serif:Literata,ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body.night{
  --table:#0E1117; --on-line:#262D39;
  --card:#232A36; --card-ink:#EDE6DA; --card-soft:#A7AFBC; --card-line:#353D4B;
  --sand:#2C3443; --deck1:#1C222D; --deck2:#151A22; --btn:#E6DED1;
  --shadow:0 18px 40px rgba(0,0,0,.6); --shadow-s:0 10px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--table);color:var(--on);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;transition:background-color .7s ease;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.progress{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) 20px 0;opacity:0;transition:opacity .3s;pointer-events:none}
.progress.on{opacity:1}
.seg{flex:1;height:2px;border-radius:2px;background:var(--on-line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

.screen{max-width:30rem;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 20px calc(env(safe-area-inset-bottom) + 14px)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 4px 10px;font-size:14px;color:var(--on-soft)}
.top b{font-weight:500;color:var(--on)}
.txt{background:none;border:0;padding:10px 4px;margin:0 -4px;font-size:15px;color:var(--on-soft);cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding-top:10px}

.deck{position:relative;margin-bottom:14px}
.deck::before,.deck::after{content:"";position:absolute;border-radius:20px}
.deck::after{left:18px;right:18px;top:20px;bottom:-14px;background:var(--deck2)}
.deck::before{left:9px;right:9px;top:10px;bottom:-7px;background:var(--deck1);z-index:1}
.qcard{position:relative;z-index:2;background:var(--card);color:var(--card-ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 24px 24px;transition:background-color .7s ease,color .7s ease}
.qhead{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-soft)}
.qhead span:last-child{letter-spacing:.04em;font-variant-numeric:tabular-nums}
.qtext{margin:14px 0 0;font-family:var(--serif);font-size:27px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.qtext.l{font-size:23px;line-height:1.25}
.qtext.s{font-size:18px;line-height:1.3}

.hand{margin:auto 0;padding:22px 8px 4px}
.step{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--on-soft);margin:0 0 12px}
.acard{display:flex;align-items:center;gap:12px;min-height:68px;border-radius:16px;background:var(--sand);color:var(--card-ink);box-shadow:var(--shadow-s);padding:14px 16px 14px 22px;font-family:var(--serif);font-size:21px;line-height:1.25;text-wrap:balance;transition:background-color .7s ease,color .7s ease,box-shadow .2s ease}
.acard.a1{transform:rotate(-1deg)}
.acard.a2{transform:rotate(1deg)}
.acard .t{flex:1;min-width:0}
.acard .toks{display:flex;gap:6px;flex:none}
.oder{text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--on-mute);padding:8px 0}
.tok{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-family:var(--serif);font-size:15px;line-height:1;flex:none}
.tok.solid{background:var(--card-ink);color:var(--sand)}
.tok.ring{border:2px solid var(--card-ink);color:var(--card-ink)}
.pop .acard .tok{animation:pop .32s cubic-bezier(.2,.8,.2,1.2) both}
.pop .acard .tok+.tok{animation-delay:.12s}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin:16px 0 0;font-size:13px;color:var(--on-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .tok{width:22px;height:22px;font-size:11px}
.legend .tok.solid{background:var(--on);color:var(--table)}
.legend .tok.ring{border:1.5px solid var(--on);color:var(--on)}
.cap{text-align:center;margin:14px 0 0;font-size:15px;color:var(--on)}
.ask{text-align:center;margin:4px 0 0;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--accent)}

.kicker{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:50px;line-height:1;letter-spacing:-.02em}
h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.12;letter-spacing:-.015em}
h3{margin:30px 0 4px;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.25}
.lead{margin:0;font-size:16px;line-height:1.55;color:var(--on-soft)}
.lead+.lead{margin-top:10px}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--btn);color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.line{background:none;border:1.5px solid var(--on-line);color:var(--on)}
.btn:disabled{opacity:.35;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px}
.link{background:none;border:0;padding:8px 0;font-size:14px;color:var(--on-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.warn{margin:12px 0 0;font-size:14px;color:var(--flag)}
.warn:empty{display:none}

.slot{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:12px 18px;margin-top:10px;border-radius:14px;border:1.5px dashed var(--on-line);color:var(--on-soft)}
.slot.ok{border-style:solid;color:var(--on)}
.slot .st{font-size:14px;white-space:nowrap}
.slot.ok .st{color:var(--accent)}
label{display:block;font-size:15px;color:var(--on-soft);margin:22px 0 8px}
textarea{display:block;width:100%;min-height:96px;padding:12px 14px;border:1.5px solid var(--on-line);border-radius:14px;background:none;color:var(--on);font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}

.tally{background:var(--card);color:var(--card-ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 24px 24px}
.tally .who{margin:20px 0 0;font-size:14px;color:var(--card-soft)}
.tally .n{margin:2px 0 0;font-family:var(--serif);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.tally .o{font-size:14px;color:var(--card-soft)}

.list{list-style:none;margin:10px 0 0;padding:0}
.list li{padding:12px 0;border-top:1px solid var(--on-line)}
.list .q{display:block;font-family:var(--serif);font-size:17px;line-height:1.3;color:var(--on)}
.list .d{display:block;margin-top:3px;font-size:14px;line-height:1.45;color:var(--on-soft)}
details{margin-top:4px}
summary{cursor:pointer;font-size:14px;color:var(--on-soft);text-decoration:underline;text-underline-offset:3px;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
.stats{display:flex;gap:18px;margin-top:10px}
.stats div{flex:1}
.big{margin:0;font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin:18px 0 6px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px 10px 0;border-top:1px solid var(--on-line);font-weight:400;vertical-align:top}
thead th{border-top:0;font-size:13px;color:var(--on-soft)}
td.n{font-family:var(--serif);font-size:19px;color:var(--accent);white-space:nowrap}
.callout{margin:26px 0 0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--accent)}

.deal .qcard,.deal .tally{animation:dealIn .38s cubic-bezier(.2,.7,.2,1) both}
.deal .deck::before,.deal .deck::after{animation:fadeIn .38s ease both}
.deal .hand{animation:rise .38s .08s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .25s ease both}
@keyframes dealIn{from{opacity:0;transform:translateX(28px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.rev .qcard{padding-bottom:18px}
.rev .hand{padding-top:14px}
.rev .acard{min-height:56px;padding:11px 14px 11px 18px;font-size:19px}
.rev .oder{padding:4px 0}
.rev .legend{margin-top:10px}
.rev .cap{margin-top:8px}
.rev .ask{font-size:17px}
.rev #go{margin-top:12px!important}
@media (max-height:720px){
  .screen{padding-top:calc(env(safe-area-inset-top) + 22px)}
  .qcard{padding:16px 20px 20px}
  .qtext{font-size:23px;margin-top:10px}.qtext.l{font-size:20px}
  .hand{padding-top:12px}
  .step{margin-bottom:8px}
  .acard{min-height:54px;padding:10px 14px 10px 18px;font-size:19px}
  .tok{width:32px;height:32px}
  .oder{padding:3px 0}
  .legend{margin-top:8px}
  .cap{margin-top:6px}
  .ask{font-size:17px}
  #go{margin-top:10px!important}
  .rev .qhead{display:none}
  .rev .qtext{margin-top:0}
  .rev .acard{min-height:50px;padding:9px 12px 9px 16px;font-size:17.5px}
  .rev .ask{font-size:16px}
  .rev .step{margin-bottom:6px}
  .foot{min-height:40px;padding-top:2px}
}
.flash{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent)}
.plab{margin:28px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
.pairbtn{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:64px;margin-top:10px;padding:14px 18px;border:0;border-radius:16px;background:var(--card);color:var(--card-ink);box-shadow:var(--shadow-s);text-align:left;cursor:pointer}
.pairbtn .pn{font-family:var(--serif);font-size:21px;line-height:1.2}
.pairbtn .ps{font-size:14px;font-weight:600;color:var(--card-soft);white-space:nowrap}
/* v1.6: Marken mit Stufe auf den Antwortkarten */
.tk{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.sw{font-family:var(--sans);font-size:11px;line-height:1;letter-spacing:.02em;color:var(--card-soft);white-space:nowrap}
.acard .toks{align-items:flex-start}
.tally .qtext{margin-bottom:2px}
.tl{margin:12px 0 0;font-size:16px;line-height:1.5;color:var(--card-soft)}
.demo{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;margin-top:16px;font-size:15px;color:var(--card-ink)}
.demo .tok.solid{background:var(--card-ink);color:var(--card)}
.demo .tok.ring{border:2px solid var(--card-ink);color:var(--card-ink)}
.rev .oder{padding:2px 0}
@media (max-height:720px){
  .rev .tok{width:30px;height:30px;font-size:13px}
  .rev .sw{font-size:10px}
}
/* Variante 1 (07.10.): Sprechblase = was jemand über sich sagt, Denkblase = was der andere gedacht hat.
   Jede Person hat ihre Farbe: erste Person Terrakotta, zweite Blau. Gedachtes steht kursiv. */
:root{--pa:#E8956A;--pb:#86A9CE}
.p0{--c:var(--pa)}.p1{--c:var(--pb)}
.cmp{display:flex;flex-direction:column;gap:16px}
/* Beim Aufdecken oben verankert: „Über Anna“ bleibt stehen, wenn „Über Ben“ dazukommt. */
.rev .hand.anchor{margin:0 0 auto;padding-top:18px}
.dir{display:flex;flex-direction:column;gap:7px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.dh .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft);white-space:nowrap}
.dh .s{font-size:13px;line-height:1.3;color:var(--on-soft);text-align:right}
.dh .s.v{color:var(--accent);font-weight:600}
/* v1.7: Lange Namen kürzen statt umbrechen, damit „Nächste Karte“ auch auf kleinen Handys ohne Scrollen sichtbar bleibt. */
.dh .k{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dh .s{flex:none;white-space:nowrap}
.top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
.br{display:flex;align-items:center;gap:13px}
.br.th{gap:5px}
.who{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#17110E;font-family:var(--serif);font-size:15px;line-height:1}
.say{position:relative;flex:1;min-width:0;background:var(--card);color:var(--card-ink);border-radius:16px;padding:7px 16px 9px;box-shadow:var(--shadow-s)}
.say::before{content:"";position:absolute;left:-5px;top:50%;width:13px;height:13px;background:var(--card);border-radius:2px;transform:translateY(-50%) rotate(45deg)}
.say>span{position:relative}
.dots{flex:none;display:flex;align-items:center;gap:3px}
.dots i{display:block;border-radius:50%;border:1.5px solid var(--c)}
.dots i:first-child{width:5px;height:5px}.dots i:last-child{width:9px;height:9px}
.think{flex:1;min-width:0;border:1.5px dashed var(--c);border-radius:22px;padding:6px 16px 8px}
.think.off{border-color:var(--on-line);padding:10px 16px}
.bl{display:block;font-size:12.5px;line-height:1.35;color:var(--card-soft)}
.think .bl{color:var(--on-soft)}
.think.off .bl{font-size:14px}
.kf{display:block;font-family:var(--serif);font-size:19px;line-height:1.25}
.think .kf{font-style:italic;color:var(--on)}
.talk{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:0 4px}
.talk .tq{display:flex;gap:10px;align-items:center;margin:0;font-size:15px;line-height:1.4;color:var(--on)}
.talk .tq .who{width:26px;height:26px;font-size:12px}
.talk .g{margin:0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3;color:var(--accent)}
.intro-demo{margin:22px 4px 0}
.intro-demo .kf{font-size:17px}
.tok.pc,.legend .tok.pc{background:var(--c);color:#17110E;border:0}
.pop .dir.new{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
.pop .dir.new .th{animation:rise .38s .2s cubic-bezier(.2,.7,.2,1) both}
.pop .talk{animation:fadeIn .3s .35s ease both}
@media (max-height:720px){
  .cmp{gap:10px}
  .dir{gap:5px}
  .who{width:30px;height:30px;font-size:14px}
  .br{gap:11px}
  .say{padding:5px 14px 7px}
  .think{padding:4px 14px 6px}
  .bl{font-size:12px}
  .kf{font-size:17px}
  .talk{margin-top:10px;gap:6px}
  .talk .tq{font-size:14px}
  .talk .g{font-size:16px}
  .rev .hand.anchor{padding-top:10px}
  .rev .qtext.s{font-size:16.5px}
  .intro-demo{margin-top:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  alle.forEach(function(c){try{var d=D.decode(c);d._code=c;decoded.push(d);}catch(e){fehler.push(e.message);}});
  var list=A.sammle(decoded), pairs=A.paare(list,own.name);
  var m={own:own,fehler:fehler,list:list,pairs:pairs,konflikte:A.konflikte(list),personen:A.personen(list),screens:["start"],paar:null,group:[0],nr:{}};
  var sel=null;pairs.forEach(function(x){if(x.ready&&x.key===P.sel)sel=x;});
  if(sel){
    m.paar={a:sel.a,b:sel.b};
    m.vA=A.vergleiche(sel.a,sel.b);m.vB=A.vergleiche(sel.b,sel.a);
    m.k=A.kuerzel(sel.a.name,sel.b.name);

    add("intro",0);

    if(m.top.length&&m.rest.length)add("t",1);
    m.rest.forEach(function(i){m.nr[i]=++n;add("i"+i,1);});
    add("hl",2);

  return m;
}
function pos(){return P.view==="play"&&M.paar?Math.max(1,Math.min(M.screens.length-1,game().pos)):0;}

    p.innerHTML=groups.filter(function(g){return g.length;}).map(function(g){var f=g.filter(function(x){return x<=at;}).length/g.length;return '<span class="seg"><i style="width:'+Math.round(f*100)+'%"></i></span>';}).join("");

function nav(d){var G=game();G.pos=Math.max(1,Math.min(M.screens.length-1,pos()+d));save();render();}

function render(){
  if(!D||!A){app().innerHTML='<div class="screen"><h2>decoder.js fehlt</h2><p class="lead" style="margin-top:12px">Die Auswertung braucht die Datei decoder.js im selben Ordner.</p></div>';return;}

}

/* ---------- Feedback zu den Karten, über alle Codes der Sammlung ---------- */
function feedback(){
  frame(false,false);
  var F=A.feedback(M.list);
  function frac(a,b){return a+" von "+b;}
  function name(x){return (x.i+1)+' · '+esc(A.KARTEN[x.i].t)+(x.gd?' (Gedankenexperiment)':'');}
  function reasons(x){
    var r=[];
    if(x.einseitig)r.push(x.mehr+" von "+x.selbst+" antworten über sich gleich");
    if(x.vorhersehbar)r.push(frac(x.richtig,x.paare)+" Tipps richtig, die Karte überrascht kaum");
    if(x.lang)r.push(frac(x.lang,x.karten)+" Mal über 15 Sekunden");
    return r;
  }
  var top=F.items.filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,5);
  var h='<p class="lead" style="margin-top:10px">Grundlage: '+F.codes+(F.codes===1?" Code":" Codes")+' von '+F.personen+(F.personen===1?" Person":" Personen")+'. Bei wenigen Codes sind das Hinweise, keine Belege.</p>';
  h+='<h3>Am auffälligsten</h3>';
  h+=top.length?'<ul class="list">'+top.map(function(x){return '<li><span class="q">'+name(x)+'</span><span class="d">'+esc(reasons(x).join(". "))+'.</span></li>';}).join("")+'</ul>':'<p class="lead" style="margin-top:8px">Bisher fällt keine Karte auf.</p>';
  h+='<details><summary>Alle '+N+' Karten</summary><ul class="list">'+F.items.map(function(x){
    var it=A.KARTEN[x.i];
    return '<li><span class="q">'+name(x)+'</span><span class="d">Über sich: '+esc(it.ka)+' '+x.a+', '+esc(it.kz)+' '+x.b+
      '. Tipps richtig: '+(x.paare?frac(x.richtig,x.paare):"noch keine")+'. Über 15 Sekunden: '+frac(x.lang,x.karten)+'.</span></li>';
  }).join("")+'</ul></details>';
  h+='<p class="lead" style="margin-top:22px;font-size:14px">So wird gezählt: Antworten fast alle über sich gleich, trennt die Karte kaum. Tippen fast alle richtig, überrascht sie kaum. Ein Tipp zählt nur, wenn Teil 1 der getippten Person in der Sammlung ist. „Über 15 Sekunden“ zählt Karten aus Teil 1 und Teil 2. Jede Person zählt über sich nur einmal.</p>';
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>Feedback</b><button class="txt" id="home">Sammlung</button></div>'+
    '<h2 style="margin-top:6px">Wie die Karten ankommen</h2>'+h+
    '<div class="foot" style="margin-top:20px"><button class="txt" id="back">Zurück zur Sammlung</button></div></div>';
  $("home").onclick=home;$("back").onclick=home;
}

document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="BUTTON"||tg==="A"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(P.view!=="play")return;
  if(e.key==="Enter"||e.key==="ArrowRight"){var g=$("go");if(g&&!g.disabled){e.preventDefault();g.click();}}
  else if(e.key==="ArrowLeft"){var b=$("back");if(b){e.preventDefault();b.click();}}
});

render();
})();
</script>
</body>
</html>
