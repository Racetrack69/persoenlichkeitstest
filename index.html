<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entweder Oder">

<style>

@font-face{font-family:Literata;font-style:normal;font-weight:400;font-display:swap;src:url("fonts/literata-latin-normal.woff2") format("woff2")}
@font-face{font-family:Literata;font-style:italic;font-weight:400;font-display:swap;src:url("fonts/literata-latin-italic.woff2") format("woff2")}

/* Richtung „Kartenspiel": dunkler Tisch, helle Karten. Für die Gedankenexperimente wird es Nacht. */
:root{
  color-scheme:dark;
  --table:#17110E; --on:#EFE4D2; --on-soft:#B3A493; --on-mute:#857767; --on-line:#3A2F27;
  --card:#F2E8D8; --card-ink:#2A1E17; --card-soft:#6B5747; --card-line:#DDCFB9; --field:#B9A88F;
  --sand:#E7D7BE; --deck1:#C9B99F; --deck2:#8F7F69;
  --accent:#E9B872; --accent-ink:#1E1510; --btn:#F2E8D8; --warm:#8A5A2B; --flag:#E39A82;
  --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-s:0 10px 24px rgba(0,0,0,.4);
  --serif:Literata,ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body.night{
  --table:#0E1117; --on-line:#262D39;
  --card:#232A36; --card-ink:#EDE6DA; --card-soft:#A7AFBC; --card-line:#353D4B;
  --sand:#2C3443; --deck1:#1C222D; --deck2:#151A22; --btn:#E6DED1;
  --shadow:0 18px 40px rgba(0,0,0,.6); --shadow-s:0 10px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--table);color:var(--on);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;transition:background-color .7s ease;-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.progress{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) 20px 0;opacity:0;transition:opacity .3s;pointer-events:none}
.progress.on{opacity:1}
.seg{flex:1;height:2px;border-radius:2px;background:var(--on-line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.seg.gd{flex:.7}

.screen{max-width:30rem;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 20px calc(env(safe-area-inset-bottom) + 14px)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 4px 10px;font-size:14px;color:var(--on-soft)}
.top b{font-weight:500;color:var(--on)}
.txt{background:none;border:0;padding:10px 4px;margin:0 -4px;font-size:15px;color:var(--on-soft);cursor:pointer}
.txt:disabled{opacity:.35;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding-top:12px}

/* Fragekarte mit Stapel dahinter */
.deck{position:relative;margin-bottom:14px}
.deck::before,.deck::after{content:"";position:absolute;border-radius:20px}
.deck::after{left:18px;right:18px;top:20px;bottom:-14px;background:var(--deck2)}
.deck::before{left:9px;right:9px;top:10px;bottom:-7px;background:var(--deck1);z-index:1}
.qcard{position:relative;z-index:2;background:var(--card);color:var(--card-ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 24px 26px;transition:background-color .7s ease,color .7s ease}
.qhead{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-soft)}
.qhead span:last-child{letter-spacing:.04em;font-variant-numeric:tabular-nums}
.qtext{margin:14px 0 0;font-family:var(--serif);font-size:30px;line-height:1.18;letter-spacing:-.01em;text-wrap:balance}
.qtext.m{font-size:27px}
.qtext.l{font-size:24px;line-height:1.24}

/* Antwortkarten: eigene Karten, räumlich getrennt von der Frage */
.hand{margin:auto 0;padding:30px 8px 6px}
.acard{appearance:none;display:block;width:100%;min-height:72px;border:0;border-radius:16px;background:var(--sand);color:var(--card-ink);box-shadow:var(--shadow-s);padding:16px 20px;text-align:left;font-family:var(--serif);font-size:21px;line-height:1.28;text-wrap:balance;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,background-color .7s ease,color .7s ease}
.acard.a1{transform:rotate(-1deg)}
.acard.a2{transform:rotate(1deg)}
@media(hover:hover){.acard:hover{transform:rotate(0) translateY(-2px)}}
.acard:active{transform:scale(.985)}
.hand.done .acard{opacity:.4}
.hand.done .acard.sel{opacity:1;transform:rotate(0) translateY(-3px);box-shadow:0 0 0 3px var(--accent),var(--shadow-s)}
.about{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--on-soft);margin:0 0 12px}
.plabel{display:block;font-family:var(--serif);font-size:19px;margin-bottom:8px}
.prow{display:flex;gap:8px}
.pbtn{appearance:none;min-width:72px;min-height:44px;padding:8px 18px;border:1.5px solid var(--field);border-radius:999px;background:none;color:var(--card-ink);font-family:var(--serif);font-size:19px;cursor:pointer}
.pbtn[aria-pressed="true"]{background:var(--card-ink);border-color:var(--card-ink);color:var(--card)}
.oder{text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--on-mute);padding:9px 0}

/* Allgemeine Bausteine */
.kicker{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:54px;line-height:.98;letter-spacing:-.02em}
h2{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.015em}
.lead{margin:0;font-size:16px;line-height:1.55;color:var(--on-soft)}
.lead+.lead{margin-top:10px}
.serif{font-family:var(--serif)}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--btn);color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.line{background:none;border:1.5px solid var(--on-line);color:var(--on)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.warn{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--flag)}
.links{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px}
.link{background:none;border:0;padding:8px 0;font-size:14px;color:var(--on-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Startkarte mit Namen */
.formdeck{position:relative;margin:36px 0 0}
.formdeck::before{content:"";position:absolute;left:14px;right:4px;top:12px;bottom:-12px;background:var(--deck1);border-radius:18px;transform:rotate(3deg)}
.formcard{position:relative;background:var(--card);color:var(--card-ink);border-radius:18px;box-shadow:var(--shadow);padding:24px 24px 26px;display:flex;flex-direction:column;gap:20px}
.formcard label{display:block;font-family:var(--serif);font-size:19px;margin-bottom:4px}
.formcard input{width:100%;border:0;border-bottom:1.5px solid var(--field);border-radius:0;background:none;padding:6px 0;font-family:var(--serif);font-size:24px;color:var(--card-ink)}
.formcard input::placeholder{color:#9C8B7B}
.formcard input:focus{outline:none;border-bottom-color:var(--card-ink)}

/* Übersicht */
.part{appearance:none;display:block;width:100%;border:0;border-radius:18px;background:var(--card);color:var(--card-ink);box-shadow:var(--shadow-s);padding:20px 22px;text-align:left;cursor:pointer;margin-top:14px}
.part:disabled{background:none;color:var(--on-mute);border:1.5px dashed var(--on-line);box-shadow:none;cursor:default}
.part.fin{background:none;color:var(--on);border:1.5px solid var(--on-line);box-shadow:none}
.part .pk{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-soft)}
.part:disabled .pk,.part.fin .pk{color:var(--on-mute)}
.part .pt{display:block;font-family:var(--serif);font-size:26px;line-height:1.15;margin-top:6px}
.part .pm{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px;color:var(--card-soft)}
.part:disabled .pm,.part.fin .pm{color:var(--on-mute)}
.part .ps{font-weight:600;color:var(--warm);white-space:nowrap}
.part.fin .ps{color:var(--accent)}
.part:disabled .ps{color:var(--on-mute);font-weight:500}
.part.wait{background:none;color:var(--on-mute);border:1.5px dashed var(--on-line);box-shadow:none}
.part.wait .pk,.part.wait .pm{color:var(--on-mute)}
.part.wait .ps{color:var(--on-mute);font-weight:500}

/* Fertig und Code */
.stat{margin:22px 0 4px;font-family:var(--serif);font-size:64px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent)}
.codecard{background:var(--card);color:var(--card-ink);border-radius:18px;box-shadow:var(--shadow-s);padding:18px 20px;margin:24px 0 14px}
.codecard .for{font-size:13px;color:var(--card-soft);margin:0 0 8px}
.code{font-family:var(--mono);font-size:13px;line-height:1.6;word-break:break-all;user-select:all;-webkit-user-select:all}
.rule{border:0;border-top:1px solid var(--on-line);margin:28px 0}
.flash{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent)}
.plab{margin:28px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-soft)}
.fhint{margin:-8px 0 0;font-size:14px;line-height:1.45;color:var(--card-soft)}
.privacy{margin:16px 0 0;padding:12px 14px;border:1px solid var(--on-line);border-radius:12px;font-size:14px;line-height:1.5;color:var(--on-soft)}
.invite{margin:18px 0 4px;padding:16px;border:1.5px solid var(--accent);border-radius:16px}
.invite p{margin:0 0 12px;font-family:var(--serif);font-size:19px}

/* Ruhige Übergänge: Karte wird ausgeteilt */
.deal .qcard{animation:dealIn .38s cubic-bezier(.2,.7,.2,1) both}
.deal .deck::before,.deal .deck::after{animation:fadeIn .38s ease both}
.deal .hand{animation:rise .38s .08s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .25s ease both}
@keyframes dealIn{from{opacity:0;transform:translateX(28px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* Kleine Handys (iPhone SE und ähnlich): etwas kompakter, damit die Karten ohne Scrollen sichtbar sind */
@media (max-height:720px){
  .screen{padding-top:calc(env(safe-area-inset-top) + 22px)}
  .qcard{padding:16px 20px 20px}
  .qtext{font-size:26px;margin-top:10px}.qtext.m{font-size:24px}.qtext.l{font-size:20px}
  .hand{padding-top:18px}
  .acard{min-height:52px;padding:11px 16px;font-size:18px}
  .about{margin-bottom:6px;font-size:15px}
  .formcard{gap:14px;padding:20px 22px 22px}
  .oder{padding:5px 0}
  .foot{min-height:44px;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

/* Setzt Name und Pronomen ein. Unbekannte Platzhalter bleiben stehen, damit der Round-Trip sie findet. */
function fill(text,name,pron){

function isBlockStart(i){return STARTS.indexOf(i)>=0;}
/* Vor jedem Block mit Gedankenexperimenten kommt ein Einstieg. */
function needsIntro(i){return i===0||(i<N&&isBlockStart(i)&&isG(i));}
function isLastBlock(i){return blockIndex(i)===BLOECKE.length-1;}

function tc(ms){return ms<2000?0:ms<5000?1:ms<15000?2:3;}
function BitW(){this.b=[];}
BitW.prototype.p=function(v,n){for(var k=n-1;k>=0;k--)this.b.push((v>>k)&1);};
BitW.prototype.out=function(){var o=[];for(var i=0;i<this.b.length;i+=8){var x=0;for(var k=0;k<8;k++)x=(x<<1)|(this.b[i+k]||0);o.push(x);}return o;};

function b64b(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return b64(s);}

/* Ein Code pro Person, Aufbau siehe code-format.md (PT17, 21 Byte Nutzdaten) */
function buildCode(S){

<script>

/* Stand aus v1.6 oder v1.5: Die Karten sind neu, also beginnen Teil 1 und Teil 2 neu. Name und Personen bleiben. */
function migrate(){
  for(var s=0;s<OLD_STORES.length;s++){
    try{
      var o=JSON.parse(localStorage.getItem(OLD_STORES[s])||"null");
      if(!o||!o.me)continue;
      var n=fresh();n.me=o.me;n.view="hub";n.invite=o.invite||"";
      (Array.isArray(o.people)?o.people:(o.partner?[{name:o.partner,pron:o.pron}]:[])).forEach(function(p){

      });
      flashMsg="Es gibt neue Karten. Teil 1 und Teil 2 beginnen neu, deine Personen sind noch da. Alte Codes passen nicht mehr.";
      try{localStorage.setItem(STORE,JSON.stringify(n));OLD_STORES.forEach(function(k){localStorage.removeItem(k);});}catch(e){}

}

function takeInvite(){
  try{

    '<div style="margin-top:auto;padding-top:28px">'+
      '<button class="btn" id="go">Hinzufügen</button>'+
      '<div class="links" style="justify-content:center;margin-top:10px"><button class="link" id="cancel">Abbrechen</button></div>'+
    '</div></div>';
  Array.prototype.forEach.call(app().querySelectorAll(".pbtn"),function(b){
    b.onclick=function(){pron=b.dataset.p;Array.prototype.forEach.call(app().querySelectorAll(".pbtn"),function(x){x.setAttribute("aria-pressed",String(x===b));});$("warn").textContent="";};
  });
  function submit(){
    var name=clean($("pname").value), w=$("warn");
    if(!name){w.textContent="Der Name fehlt noch.";$("pname").focus();return;}
    if(norm(name)===norm(S.me)){w.textContent="Das ist dein eigener Name.";return;}
    if(findPerson(name)>=0){w.textContent="Mit "+S.people[findPerson(name)].name+" spielst du schon.";return;}
    if(!pron){w.textContent="Wähl noch, ob die App über "+name+" mit er oder sie schreibt.";return;}
    S.people.push({name:name,pron:pron,other:freshPart()});
    if(norm(S.invite)===norm(name))S.invite="";
    S.addName="";
    if(S.self.done)startPart("other",S.people.length-1);
    else{flashMsg=name+" ist dabei. Sobald Teil 1 fertig ist, geht es mit "+name+" los.";S.view="hub";go();}
  }
  $("go").onclick=submit;
  $("pname").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();submit();}};
  $("cancel").onclick=function(){S.addName="";S.view="hub";go();};
}

/* ---------- Einstiege: zu Beginn und vor jedem Block Gedankenexperimente ---------- */
function intro(){
  var P=partObj(), self=S.part==="self", p=cur(), pa=p?esc(p.name):"";
  var night=K.isG(P.i), n=K.BLOECKE[K.blockIndex(P.i)].n, head, card, text, btn;
  if(!night){
    if(self){
      head="Teil 1 · Über dich";
      card="Es geht um dich und die Menschen, die dir nahestehen.";
      text='<p class="lead">Lies die Szene und tipp auf die Antwort, die besser passt. Dann kommt gleich die nächste Karte.</p>'+
        '<p class="lead">Wenn beides ein bisschen stimmt: Bauch, nicht Kopf. Es gibt keine bessere Seite.</p>'+
        '<p class="lead">Zwischendurch kommen Gedankenexperimente. Dann wird es kurz Nacht.</p>';
    }else{
      head="Teil 2 · Über "+pa;
      card="Was trifft eher auf "+pa+" zu?";
      text='<p class="lead">Dieselben Karten, diesmal mit '+pa+' darin. Tipp auf die Antwort, die eher zu '+pa+' passt.</p>'+
        '<p class="lead">Auch wenn du dir nicht sicher bist: Bauch, nicht Kopf. Raten gehört dazu.</p>';
    }
    btn="Erste Karte ziehen";
  }else{
    head=K.isLastBlock(P.i)?"Zum Schluss":"Zwischendurch";
    card=cap(ZAHL[n]||String(n))+" Gedankenexperimente.";
    text=self?
      '<p class="lead">Die Antworten sind bewusst knapp, das Warum gehört ins Gespräch.</p>'+
      '<p class="lead">Auch hier tippt die andere Person, was du wählst.</p>':
      '<p class="lead">Was würde '+pa+' wählen? Die Antworten sind bewusst knapp, das Warum gehört ins Gespräch.</p>';
    btn="Weiter";
  }
  frame(night,true);
  app().innerHTML='<div class="screen">'+
    '<div class="top"><b>'+(self?"Über dich":"Über "+pa)+'</b></div>'+
    '<div class="deck"><div class="qcard"><div class="qhead"><span>'+head+'</span></div><p class="qtext m">'+card+'</p></div></div>'+
    '<div class="hand" style="padding-left:4px;padding-right:4px">'+text+'</div>'+
    '<button class="btn" id="go">'+btn+'</button>'+
    '<div class="foot"><button class="txt" id="back">'+(P.i===0?"Übersicht":"Zurück")+'</button></div>'+
    '</div>';
  $("go").onclick=function(){S.intro=false;go();};
  $("back").onclick=function(){
    if(P.i===0)toHub();
    else{S.intro=false;P.i--;go();}
  };
}

/* ---------- Karten: ein Tipp, dann die nächste ---------- */
/* Die Reihenfolge von A und B wird pro Karte und Person gemischt. */
function sizeClass(q){return q.length>100?" l":q.length>65?" m":"";}
function cardHTML(o){
  var f=flipFor(o.P,o.k), first=f?{t:o.item.z,v:1}:{t:o.item.a,v:0}, second=f?{t:o.item.a,v:0}:{t:o.item.z,v:1};
  var done=o.chosen===0||o.chosen===1;
  function ac(x,cls){return '<button class="acard '+cls+(done&&o.chosen===x.v?" sel":"")+'" data-v="'+x.v+'">'+esc(x.t)+'</button>';}
  return '<div class="screen">'+
    '<div class="top"><b>'+o.who+'</b><button class="txt" id="pause">Pause</button></div>'+
    '<div class="deck"><div class="qcard"><div class="qhead"><span>'+esc(o.label)+'</span><span>'+o.num+'</span></div>'+
      '<p class="qtext'+sizeClass(o.item.q)+'" id="q">'+esc(o.item.q)+'</p></div></div>'+
    '<div class="hand'+(done?" done":"")+'" role="group" aria-labelledby="q">'+(o.ask?'<p class="about">'+o.ask+'</p>':'')+
      ac(first,"a1")+'<div class="oder" aria-hidden="true">oder</div>'+ac(second,"a2")+
    '</div>'+
    '<div class="foot"><button class="txt" id="back">Zurück</button>'+(o.canNext?'<button class="txt" id="next" style="color:var(--on)">Weiter</button>':'')+'</div>'+
    '</div>';
}
function playQ(){
  var self=S.part==="self", p=cur(), P=partObj(), i=P.i, it=K.KARTEN[i], gd=K.isG(i), pa=p?esc(p.name):"";
  var item=self?{q:it.qs,a:it.a,z:it.z}:{q:K.fill(it.qo,p.name,p.pron),a:K.fill(it.ao,p.name,p.pron),z:K.fill(it.zo,p.name,p.pron)};
  frame(gd,true);
  app().innerHTML=cardHTML({P:P,k:(self?"s":"f")+i,item:item,chosen:P.ans[i],
    ask:self?"":(gd?"Was würde "+pa+" wählen?":"Was trifft eher auf "+pa+" zu?"),
    who:self?"Über dich":"Über "+pa,label:gd?"Gedankenexperiment":it.t,num:(i+1)+" / "+N,canNext:P.ans[i]!==null});
  function advance(){
    addTime(P,i);P.i++;
    if(P.i>=N){
      P.done=true;S.part=null;
      if(self){
        S.view="hub";
        flashMsg=S.people.length?"Teil 1 geschafft. Jetzt geht es mit Teil 2 weiter.":"Teil 1 geschafft. Füg jetzt eine Person hinzu oder lade jemanden ein.";
      }else{S.view="person";flashMsg="Geschafft. Jetzt kann "+p.name+" deinen Code bekommen.";}
    }else if(K.needsIntro(P.i))S.intro=true;
    save();later(render);
  }
  var h=app().querySelector(".hand");
  Array.prototype.forEach.call(h.querySelectorAll(".acard"),function(b){
    b.onclick=function(){
      if(moving)return;
      h.classList.add("done");
      Array.prototype.forEach.call(h.querySelectorAll(".acard"),function(x){x.classList.toggle("sel",x===b);});
      P.ans[i]=+b.dataset.v;advance();
    };
  });
  $("back").onclick=function(){
    if(moving)return;
    addTime(P,i);
    if(K.needsIntro(i))S.intro=true;else P.i--;
    go();
  };
  $("pause").onclick=function(){if(moving)return;addTime(P,i);toHub();};
  if($("next"))$("next").onclick=function(){if(!moving)advance();};
}

/* ---------- Eine Person: Code, Projektion, Entfernen ---------- */
function person(){
  S.view="person";frame(false,false);
  var p=cur(), pa=esc(p.name), code=p.code;
  var head;
  if(code){
    var pr=K.projection({self:S.self,other:p.other});
    head='<p class="kicker" style="margin-top:34px">Teil 2 fertig</p><h2>Dein Code für '+pa+'</h2>'+
      (flashMsg?'<p class="flash" role="status">'+esc(flashMsg)+'</p>':'')+
      '<p class="privacy">Wer diesen Code hat, kann alle deine Antworten lesen: über dich, über '+pa+' und die Gedankenexperimente. Schick ihn nur an Menschen, die das sehen dürfen.</p>'+
      '<div class="codecard"><p class="for">Von '+esc(S.me)+' für '+pa+'</p><div class="code" id="code">'+esc(code)+'</div></div>'+
      '<button class="btn" id="wa">Per WhatsApp schicken</button>'+
      '<div class="row" style="margin-top:10px"><button class="btn line" id="copy">Kopieren</button><button class="btn line" id="dl">Als Datei</button></div>'+
      (pr?'<hr class="rule"><p class="stat">'+pr.prozent+'%</p>'+
        '<p class="lead">So oft hast du bei '+pa+' dieselbe Antwort getippt wie bei dir selbst, bei '+pr.gleich+' von '+pr.gesamt+' Karten.</p>'+
        '<p class="lead">Reiner Zufall läge bei 50 Prozent. Wer deutlich darüber liegt, beschreibt beim Einschätzen ein Stück weit sich selbst. Das passiert jedem, und wer sich ähnlich ist, liegt damit oft sogar richtig.</p>':'')+
      '<hr class="rule"><p class="lead">Wenn der Code von '+pa+' da ist, setzt euch zusammen und deckt auf.</p>'+
      '<a class="btn line" style="margin-top:14px" href="auswertung.html">Zur Auswertung</a>';
  }else{
    head='<p class="kicker" style="margin-top:34px">Teil 2</p><h2>Über '+pa+'</h2>'+
      '<p class="lead" style="margin-top:10px">'+(S.self.done?'Teil 2 über '+pa+' ist noch nicht fertig.':'Sobald Teil 1 über dich fertig ist, geht es hier los.')+'</p>';
  }
  app().innerHTML='<div class="screen">'+head+
    '<div class="links" style="margin-top:auto;padding-top:24px"><button class="link" id="home">Zur Übersicht</button><button class="link" id="remove">'+pa+' entfernen</button></div>'+
    '</div>';
  flashMsg="";
  $("home").onclick=toHub;
  $("remove").onclick=function(){
    if(!confirm(p.name+" und deine Antworten über "+p.name+" entfernen? Ein Code, den du schon verschickt hast, bleibt beim Empfänger gültig."))return;
    S.people.splice(S.cur,1);toHub();
  };
  if(!code)return;
  $("copy").onclick=function(){
    var b=$("copy");
    function sel(){var r=document.createRange();r.selectNodeContents($("code"));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Markiert";}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(function(){b.textContent="Kopiert";},sel);else sel();
    setTimeout(function(){b.textContent="Kopieren";},2500);
  };
  $("wa").onclick=function(){
    openWhatsApp("Entweder oder: mein Code für dich, "+p.name+".\n\n"+code+"\n\nZum Aufdecken: "+pageUrl("auswertung.html")+
      "\n\nNoch nicht mitgespielt? Mit diesem Link steht mein Name schon richtig drin: "+inviteUrl());
  };
  $("dl").onclick=function(){
    var safe=(S.me+"-fuer-"+p.name).replace(/[^a-zA-Z0-9äöüÄÖÜß-]+/g,"_");
    var a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(code);a.download="entweder-oder_"+safe+".txt";a.click();
  };
}

/* Tastatur am Laptop: 1/2 oder Pfeile für die Karten, Enter für Weiter */
document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"&&tg!=="BUTTON"&&tg!=="A"){var n=$("next");if(n){e.preventDefault();n.click();}return;}
  var idx=(e.key==="1"||e.key==="ArrowUp"||e.key==="ArrowLeft")?0:(e.key==="2"||e.key==="ArrowDown"||e.key==="ArrowRight")?1:-1;
  if(idx<0)return;
  var cards=app().querySelectorAll(".acard");if(cards[idx]){e.preventDefault();cards[idx].click();}
});

render();
})();
</script>
</body>
</html>
